name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (python feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Clippy (certified feature)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y m4
          cargo clippy --all-targets --features certified -- -D warnings
      - name: Tests (golden + property suite)
        run: cargo test --release
      - name: Tests (certified feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --features certified
      - name: CLI smoke test
        run: |
          cargo run --release --bin vanish -- rung --p 3457 --s 32 --r 16 --q 2 | grep "bucket = 422"
          cargo run --release --bin vanish -- decompose --p 77569 --s 32 --r 16 --lam 0 | grep "bucket(0) = 30598"

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install maturin numpy pytest
          maturin build --release --features python
          pip install target/wheels/*.whl
      - name: Golden parity tests
        run: pytest python/tests/ -q
