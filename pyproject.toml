[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "vanish"
version = "0.5.0"
description = "Fast exact kernels for the bucket-landscape program"
requires-python = ">=3.9"

[tool.maturin]
features = ["python"]
module-name = "vanish"
include = [{ path = "vanish.pyi", format = "wheel" }]
