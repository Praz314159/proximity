[package]
name = "vanish"
version = "0.5.0"
edition = "2021"
description = "Exact computational toolkit for exploring proximity gaps, correlated agreement, and list decoding near capacity for smooth-domain Reed-Solomon codes"
repository = "https://github.com/Praz314159/proximity"
license = "MIT OR Apache-2.0"
rust-version = "1.77"
keywords = ["coding-theory", "list-decoding", "proximity-gaps", "snark", "reed-solomon"]
categories = ["cryptography", "mathematics", "science"]

[lib]
name = "vanish"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vanish"
path = "src/bin/cli.rs"
required-features = []

[dependencies]
rayon = "1.10"
thiserror = "2"
num-bigint = "0.4"
rug = { version = "1.24", optional = true }
pyo3 = { version = "0.22", features = ["abi3-py39"], optional = true }
numpy = { version = "0.22", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "hotpath_baseline"
harness = false

[features]
default = []
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module", "pyo3/num-bigint"]
# The certified bracket arithmetic + attack tier (MPFR via rug).
# Optional: rug builds gmp-mpfr-sys from source (~minutes, needs m4).
certified = ["dep:rug"]

[profile.release]
lto = true
codegen-units = 1

[[example]]
name = "bench_dp"

[[example]]
name = "bench_sweep"

[[example]]
name = "table4"
required-features = ["certified"]

[[example]]
name = "pinch"
required-features = ["certified"]
